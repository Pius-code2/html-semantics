		<h1>Register</h1>

				<fieldset>

			</div>
			<div class="Security">

					<label for="phone">Pin:</label><br>

					<label for="phone">Confirm Pin:</label><br>

					</select><br>

					<label for="phone">Enter the answer:</label>
					<input type="password"id="phone"name="phone"><br>
				</fieldset>
			</div>

			<div class="Security">
				<fieldset>
					<legend>Log-In Info</legend>

					<input type="name" id="phone" name="phone"><br>

					<label for="email">Email</label><br>
					<input type="email" id="email" name="email"><br>

					<label for="phone">Phone</label><br>
					<input type="text" id="phone" name="phone"><br>

					<label for="phone">Pin:</label><br>

					<label for="phone">Confirm Pin:</label><br>

				</fieldset>
			</div>

			<div>
				<fieldset>

					<input type="tel"id="phone"name="phone"><br>

					<label for="email">Email Address:</label><br>

					<input type="text" name="Surname"><br>
