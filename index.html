<h2>Contact Me</h2>
<p>Fill out the form below, and I will get back to you within 24 hours.</p>

<form action="#"method="post">
	<fieldset>
		<legend>contact info</legend>
	
<div>
<label for="name">Full Name:</label>
<input type="text"id="name"name="full_name"required>
</div>

<div>
<label for="email">Email Address:</label>
<input type="email"id="email"name="email"required>
</div>

<div>
<label for="phone">Phone Number (optional):</label>
<input type="tel"id="phone"name="phone">
</div>
</fieldset>

<div>
<label for="subject">Subject:</label>
<input type="text"id="subject"name="subject"required>
</div>

<div>
<label for="message">Message:</label>
<textareaid="message"name="message"rows="5"required></textarea>
</div>

<div>
<p>How did you hear about me?</p>
<input type="radio"id="google"name="source"value="google">
<label for="google">Google search</label>

<input type="radio"id="friend"name="source"value="friend">
<label for="friend">Friend referral</label>

<input type="radio"id="social"name="source"value="social">
<label for="social">Social media</label>
</div>

<div>
<input type="checkbox"id="newsletter"name="newsletter"value="yes">
<label for="newsletter">Subscribe to my newsletter</label>
</div>

<button type="submit">Send Message</button>
</form>
</section>

	<footer>
		<button class="sign up" style="margin-block-start: 20px;">Sign Up</button>
